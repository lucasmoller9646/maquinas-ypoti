<style>
:root{
  /* Tema oscuro: es el predeterminado (pedido de la gerencia). El claro se elige en Mi cuenta. */
  color-scheme:dark;
  --bg:#0C1710; --surface:#122018; --surface-2:#192B20; --line:#27402F; --line-strong:#3F5A48;
  --ink:#EEF1E9; --ink-2:#BFC7BA; --ink-3:#8D9789;
  --brand:#5CB37A; --brand-ink:#0E1A12; --brand-soft:#213B2A; --brand-deep:#3F8F5C;
  --accent:#E07E66; --accent-ink:#1A0D09; --accent-soft:#3F2219;
  --op:#5CB37A; --comb:#D6B058; --alm:#6FA8D8; --mec:#B58DD8; --ger:#E07E66; --pre:#6FBFBA;
  --ok:#5CB37A; --warn:#D6B058; --bad:#E07E66; --warn-soft:#3A3117; --bad-soft:#3F211B; --ok-soft:#213B2A; --info-soft:#1C2E3A;
  --focus:#6FA8D8;
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F4F3EE; --surface:#FFFFFF; --surface-2:#ECEAE2; --line:#D6D3C7; --line-strong:#A8A597;
  --ink:#1B1F1B; --ink-2:#4B534A; --ink-3:#777F72;
  --brand:#04522B; --brand-ink:#FFFFFF; --brand-soft:#DCEAE0; --brand-deep:#033B1F;
  --accent:#701E0C; --accent-ink:#FFFFFF; --accent-soft:#F3DFD9;
  --op:#04522B; --comb:#9A6A00; --alm:#1F5A7A; --mec:#6A4A8C; --ger:#701E0C; --pre:#1F6B66;
  --ok:#04522B; --warn:#9A6A00; --bad:#8A2A12; --warn-soft:#FBF0D3; --bad-soft:#F6E0DA; --ok-soft:#DCEAE0; --info-soft:#DDE8EF;
  --focus:#1F5A7A;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
  color-scheme:light;
  --bg:#F4F3EE; --surface:#FFFFFF; --surface-2:#ECEAE2; --line:#D6D3C7; --line-strong:#A8A597;
  --ink:#1B1F1B; --ink-2:#4B534A; --ink-3:#777F72;
  --brand:#04522B; --brand-ink:#FFFFFF; --brand-soft:#DCEAE0; --brand-deep:#033B1F;
  --accent:#701E0C; --accent-ink:#FFFFFF; --accent-soft:#F3DFD9;
  --op:#04522B; --comb:#9A6A00; --alm:#1F5A7A; --mec:#6A4A8C; --ger:#701E0C; --pre:#1F6B66;
  --ok:#04522B; --warn:#9A6A00; --bad:#8A2A12; --warn-soft:#FBF0D3; --bad-soft:#F6E0DA; --ok-soft:#DCEAE0; --info-soft:#DDE8EF;
  --focus:#1F5A7A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16.5px;line-height:1.5;padding:0 16px 104px}
h1,h2,h3{font-family:var(--font-display);font-variation-settings:'wdth' 90;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700} h2{font-size:19px;font-weight:700}
h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-variation-settings:'wdth' 100}
p{margin:0}
a{color:var(--brand)}
.app{max-width:560px;margin:0 auto}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hidden{display:none !important}
/* cabecera */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:8}
header.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
header.top .logo{height:30px;width:auto;display:block}
header.top .logo.light{display:none}
:root[data-theme="light"] header.top .logo.light{display:block} :root[data-theme="light"] header.top .logo.dark{display:none}
@media (prefers-color-scheme: light){ :root[data-theme="auto"] header.top .logo.light{display:block} :root[data-theme="auto"] header.top .logo.dark{display:none} }
header.top .tools{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
header.top .brand{flex:0 1 auto}
header.top .titulo{width:100%;display:flex;align-items:center;gap:10px}
header.top h1{font-size:22px;flex:1;min-width:0}
header.top h1 small{display:block;font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.01em;margin-top:3px;font-variation-settings:normal}
.netpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:999px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.netpill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.netpill.online::before{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.netpill.offline::before{background:var(--warn)}
.netpill.pend{color:var(--warn);border-color:var(--warn)}
.iconbtn{appearance:none;border:1px solid transparent;background:var(--surface-2);color:var(--ink-2);border-radius:8px;min-width:40px;height:40px;font-size:19px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px;font-family:var(--font-display);font-weight:600}
/* botones */
.btn{appearance:none;font-family:var(--font-display);font-variation-settings:'wdth' 95;font-size:15.5px;font-weight:700;border-radius:9px;padding:11px 16px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;width:100%;text-align:center;line-height:1.2;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:active{filter:brightness(.95)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:60px;font-size:18px;border-radius:12px;font-variation-settings:'wdth' 90}
.btn.ghost{background:var(--surface)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{font-size:12.5px;padding:6px 10px;border-radius:7px;min-height:34px;width:auto}
.btn.auto{width:auto}
.btn:disabled{opacity:.5;cursor:default}
.btn .sub{display:block;font-family:var(--font-body);font-weight:400;font-size:12.5px;opacity:.8;margin-top:2px}
.btn.stack{flex-direction:column;gap:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.row.nw{flex-wrap:nowrap}
.row.nw > *{flex:1 1 0;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.warn{border-color:var(--warn);background:var(--warn-soft)}
.card.bad{border-color:var(--bad)}
/* formularios */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.f > span:first-child{font-family:var(--font-display);font-variation-settings:'wdth' 100;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.hint{font-weight:400;font-size:13px;line-height:1.45;color:var(--ink-3);text-transform:none;letter-spacing:0}
.req::after{content:" *";color:var(--accent)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],input[type=email],select,textarea{font-family:var(--font-body);font-size:17px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:11px 12px;width:100%;min-height:50px}
input[type=number],input.mono{font-family:var(--font-mono)}
input.grande{font-size:24px;font-weight:600;font-family:var(--font-mono);text-align:right;min-height:58px}
textarea{min-height:90px;line-height:1.4}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.tile:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input.locked{background:var(--surface-2);color:var(--ink-2);border-style:dashed}
input.err,select.err,textarea.err{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.campo-err{color:var(--bad);font-size:13px;font-weight:600}
.inline{display:flex;gap:8px;align-items:stretch}
.inline > input,.inline > select{flex:1;min-width:0}
.inline > .btn{width:auto;flex:0 0 auto;padding:10px 14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink-2);cursor:pointer}
.chk input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--brand)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-2)}
.chipsel input{display:none}
.chipsel label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chipsel label.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg{display:flex;border-radius:9px;background:var(--surface-2);padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-family:var(--font-display);font-variation-settings:'wdth' 95;font-weight:600;font-size:14.5px;min-height:44px;padding:8px 8px;cursor:pointer;line-height:1.15}
.seg button.on{background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg button small{display:block;font-size:11.5px;font-weight:400;opacity:.85}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:none;font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink-3);padding:10px 10px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.tabs button .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-family:var(--font-mono)}
/* títulos de sección */
.section-title{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.section-title .dot{width:8px;height:8px;border-radius:2px;background:var(--brand)}
.section-title h3{flex:1}
.section-title .btn{width:auto}
/* mosaicos */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;border-left:5px solid var(--brand);padding:12px 12px;min-height:88px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;cursor:pointer;font-family:var(--font-display);font-variation-settings:'wdth' 90;font-size:16px;font-weight:700;color:var(--ink);text-align:left;position:relative}
.tile .ico{font-size:26px;line-height:1}
.tile small{display:block;margin-top:3px;font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--ink-3);line-height:1.35;font-variation-settings:normal}
.tile .n{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-size:12.5px;display:flex;align-items:center;justify-content:center}
.tile.wide{grid-column:1/-1;min-height:72px;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.tile.m-op{border-left-color:var(--op)} .tile.m-comb{border-left-color:var(--comb)} .tile.m-alm{border-left-color:var(--alm)} .tile.m-mec{border-left-color:var(--mec)} .tile.m-ger{border-left-color:var(--ger)} .tile.m-pre{border-left-color:var(--pre)}
.modulo-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:14px 0 6px}
.modulo-title i{width:18px;height:4px;border-radius:2px;background:var(--brand)}
/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line-strong);border-radius:10px;padding:11px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .main b{font-family:var(--font-display);font-variation-settings:'wdth' 90;font-weight:700;font-size:16px;line-height:1.2}
.item .main span{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.item .main span.wrap{white-space:normal}
.item .der{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.item .der b{font-family:var(--font-mono);font-size:15px}
.item.ok{border-left-color:var(--ok)} .item.warn{border-left-color:var(--warn)} .item.bad{border-left-color:var(--bad)} .item.info{border-left-color:var(--alm)}
.empty{text-align:center;color:var(--ink-3);padding:22px 8px;font-size:14.5px}
/* insignias y mensajes */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--alm)}
.msg{padding:11px 13px;border-radius:9px;font-size:14px;line-height:1.45;background:var(--surface-2);color:var(--ink-2)}
.msg.ok{background:var(--ok-soft);color:var(--ok);border-left:3px solid var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn);border-left:3px solid var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad);border-left:3px solid var(--bad)}
.msg.info{background:var(--info-soft);color:var(--alm);border-left:3px solid var(--alm)}
.msg ul{margin:4px 0 0;padding-left:18px}
dl.kv{display:grid;grid-template-columns:minmax(104px,38%) 1fr;gap:7px 12px;margin:0;font-size:15px}
dl.kv dt{font-family:var(--font-display);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-3);padding-top:3px}
dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){ .kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))} .kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .l{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--font-mono);font-size:21px;font-weight:600;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--brand);border-radius:4px}
.prog i.warn{background:var(--warn)} .prog i.bad{background:var(--bad)}
.prog-row{display:grid;grid-template-columns:minmax(78px,30%) 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.prog-row b{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}
/* tablas */
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.t th{font-family:var(--font-display);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
table.t td.n,table.t th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.t td.wrap{white-space:normal;min-width:140px}
table.t tr.bad td{background:var(--bad-soft)} table.t tr.warn td{background:var(--warn-soft)}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line-strong)}
/* línea de tiempo del parte */
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px;padding-left:14px}
.tl .ev{position:relative;padding:8px 0}
.tl .ev::before{content:"";position:absolute;left:-21px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.tl .ev.carga::before{border-color:var(--comb);background:var(--comb)}
.tl .ev.actual::before{background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tl .ev.fin::before{border-color:var(--accent);background:var(--accent)}
.tl .ev b{font-family:var(--font-display);font-size:15.5px;font-variation-settings:'wdth' 92}
.tl .ev span{display:block;font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.grande-num{font-family:var(--font-mono);font-size:34px;font-weight:600;line-height:1.1}
/* QR */
.qrbox{background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:center;align-items:center;border:1px solid var(--line)}
.qrbox canvas,.qrbox img{width:100%;max-width:300px;height:auto;image-rendering:pixelated}
.control{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:.12em;text-align:center}
/* fotos */
.foto{display:flex;flex-direction:column;gap:8px}
.foto img{width:100%;max-height:260px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.foto input[type=file]{display:none}
/* barra inferior */
.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08);padding:9px 16px;padding-bottom:max(9px,env(safe-area-inset-bottom));z-index:9}
.actionbar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.actionbar .inner .btn{flex:1;min-height:52px}
.actionbar .inner .btn.back{flex:0 0 auto;width:auto}
/* modales */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.modal .sheet .hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal .sheet .hdr h2{flex:1}
@media (min-width:640px){ .modal{align-items:center;padding:16px} .modal .sheet{border-radius:16px} }
.modal.centro{align-items:center;padding:16px}
.pin-card{max-width:340px;width:100%;text-align:center;gap:10px;background:var(--surface);border-radius:16px;padding:18px}
.pin-texto{font-size:15px;color:var(--ink-2)}
.pin-dots{display:flex;justify-content:center;gap:18px;margin:6px 0 2px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--brand);transition:background .1s}
.pin-dots i.on{background:var(--brand)}
.pin-estado{min-height:20px;font-size:14px;font-weight:600;color:var(--bad)}
.pin-estado.info{color:var(--ink-3);font-weight:500}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad button{appearance:none;font-family:var(--font-display);font-size:28px;font-weight:600;height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;touch-action:manipulation}
.pin-pad button:active{background:var(--brand-soft)}
.pin-pad button.sec{font-size:22px;color:var(--ink-3);background:var(--surface)}
.pin-pad button.ok{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-size:24px}
.pin-pad button:disabled{opacity:.45}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#scanner{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#scanner.on{display:flex}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
#scanner .bar{padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:#111;color:#fff;display:flex;gap:10px;align-items:center}
#scanner .bar .btn{background:#222;color:#fff;border-color:#444;width:auto}
#scanner .frame{position:absolute;left:50%;top:42%;width:min(72vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-family:var(--font-display);font-size:14.5px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1}
.sugs{border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);max-height:300px;overflow:auto}
.sugs button{display:block;width:100%;text-align:left;appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14.5px;padding:10px 12px;cursor:pointer}
.sugs button:last-child{border-bottom:0}
.sugs button small{display:block;color:var(--ink-3);font-family:var(--font-mono);font-size:11.5px}
.linea-art{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.linea-art:last-child{border-bottom:0}
.linea-art .d b{font-family:var(--font-display);font-size:15px;font-variation-settings:'wdth' 92;display:block;line-height:1.2}
.linea-art .d small{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.linea-art .ctl{display:flex;gap:8px;align-items:flex-end}
.linea-art .ctl label.mini{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-display)}
.linea-art .ctl input,.linea-art > input{width:100%;min-height:44px;font-size:16px;padding:8px 10px;text-align:right}
.linea-art .ctl input[data-m]{text-align:left;font-family:var(--font-body)}
.linea-art > input{max-width:140px;align-self:flex-end}
.linea-art .x{appearance:none;border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer;padding:8px 6px;min-height:44px}
.status-line{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log{font-family:var(--font-mono);font-size:11.5px;line-height:1.6;color:var(--ink-3);white-space:pre-wrap}
@keyframes gira{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .9s linear infinite;vertical-align:-2px}
details.mas > summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--ink-2);padding:6px 0;list-style:none}
details.mas > summary::-webkit-details-marker{display:none}
details.mas > summary::before{content:"▸ "} details.mas[open] > summary::before{content:"▾ "}
/* impresión de etiquetas */
#print-area{display:none}
.etiquetas{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.etq{border:1px dashed #999;border-radius:3mm;padding:3mm;display:flex;gap:3mm;align-items:center;break-inside:avoid;color:#000;background:#fff;font-family:Arial,Helvetica,sans-serif}
.etq img{width:26mm;height:26mm;image-rendering:pixelated;flex:none}
.etq b{display:block;font-size:13pt;line-height:1.1}
.etq span{display:block;font-size:8.5pt;line-height:1.2}
.etq small{display:block;font-size:7.5pt;color:#444;margin-top:1mm}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#print-area){display:none !important}
  #print-area{display:block !important}
  @page{margin:10mm}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media (max-width:360px){ body{font-size:15.5px} .tile{font-size:15px} }
/* carga de combustible con QR de los dos lados */
.qrbox.grande{padding:14px;border-color:#fff}
.qrbox.grande canvas{max-width:330px}
.qr-det{text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--ink-2);line-height:1.5}
ol.pasos{margin:0;padding-left:22px;font-size:15px;line-height:1.5;color:var(--ink-2)}
ol.pasos li{margin:2px 0} ol.pasos b{color:var(--ink)}
.conf-litros{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
.tl .ev .conf{font-family:var(--font-body);font-size:12.5px;color:var(--ok)}
.tl .ev.mal .conf{color:var(--bad)}
.tl .ev.mal::before{border-color:var(--bad);background:var(--bad)}
.f .fijo{padding:10px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.pend-carga{border-left:3px solid var(--comb)}
.btn.carga-btn{border-color:var(--comb);color:var(--comb)}
.btn.carga-btn.primary{background:var(--comb);color:var(--brand-ink);border-color:var(--comb)}
:root:not([data-theme="light"]) .modal{background:rgba(0,0,0,.62)}
:root:not([data-theme="light"]) .modal .sheet{border-top:1px solid var(--line)}

/* ===== estándar de los apps de la empresa (Registro de manejo 4.x · Orden de compra · Itaverá) ===== */
/* ancho fijo y sin zoom de pellizco ni doble toque (el mapa tiene su propia pinza) */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,*{touch-action:manipulation}
#mapa-canvas,#mapa-modal .lienzo{touch-action:none}
img,canvas,table{max-width:100%}
/* fechas y horas bien en iPhone */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;min-height:50px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
/* ingreso con código personal de 6 números */
.login{max-width:360px;margin:0 auto;text-align:center;gap:12px;padding-top:6px}
.login h2{font-size:22px;margin:4px 0 0}
.login .pin-dots{gap:14px}
.login .pin-dots i{width:16px;height:16px}
.login-ultimo{font-size:13.5px;color:var(--ink-3);min-height:18px}
.pin-pad button{touch-action:manipulation}
.usr-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.usr-chip b{color:var(--ink)}
.usr-chip .btn{flex:none;width:auto;min-height:34px;padding:4px 14px}
.sync-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3)}
.sync-bar .btn{width:auto;min-height:36px;padding:6px 12px;font-size:14px}
.autosave{font-family:var(--font-mono);font-size:11.5px;color:var(--ok);margin:0 0 4px;min-height:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.autosave.off{color:var(--ink-3)}
.borr-card{border-left:3px solid var(--warn)}
.borr-card .row .btn{flex:none;width:auto;min-width:0;padding-left:14px;padding-right:14px}
.borr-card .row .btn[data-bdel]{width:44px;padding:0}
/* botón estándar de la IA para leer una foto */
.ia-btn{white-space:nowrap}
.ia-msg{font-size:13px;line-height:1.4;color:var(--ink-3);min-height:0}
.ia-msg.ok{color:var(--ok)} .ia-msg.warn{color:var(--warn)}
.ia-spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .8s linear infinite;margin-right:6px;vertical-align:-1px}
input.ia-leyendo{background-image:linear-gradient(90deg,transparent,rgba(127,127,127,.12),transparent);background-size:200% 100%;animation:ia-brillo 1.4s linear infinite}
@keyframes ia-brillo{from{background-position:200% 0}to{background-position:-200% 0}}
/* mapa (el mismo del Registro de manejo: pin fijo en el medio, se mueve el mapa) */
#mapa-modal{position:fixed;left:0;top:0;right:0;height:100vh;height:100dvh;height:var(--alto-mapa,100dvh);background:#000;z-index:28;display:none;flex-direction:column;overflow:hidden}
#mapa-modal.on{display:flex}
#mapa-modal .lienzo{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
#mapa-modal canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;background:#1d2520}
#mapa-modal .bar{flex:none;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:#111;color:#fff;display:flex;flex-direction:column;gap:8px}
#mapa-modal .bar.top{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px}
#mapa-modal .bar .row{flex-wrap:nowrap;gap:10px;align-items:center}
#mapa-modal .bar.top .titulo{font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff;flex:1}
#mapa-modal .bar .btn{background:#222;color:#fff;border-color:#444;width:auto;flex:1;min-height:44px}
#mapa-modal .bar.top .btn{flex:0 0 auto}
#mapa-modal .bar .btn.ok{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
#mapa-modal .bar.abajo{max-height:46%;overflow:auto}
#mapa-modal .bar.abajo .btn{min-height:56px;font-size:17px}
#mapa-modal .bar.abajo #mapa-cancel{flex:0 0 38%}
#mapa-modal .bar.abajo #mapa-ok{flex:1 1 auto;font-size:19px}
#mapa-modal .zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#mapa-modal .zoom button,#mapa-modal .loc{width:44px;height:44px;border-radius:8px;border:1px solid #444;background:rgba(17,17,17,.9);color:#fff;font-size:22px;font-weight:700}
#mapa-modal .loc{position:absolute;left:12px;top:12px;font-size:20px}
#mapa-modal .attr{position:absolute;left:0;bottom:0;font-size:9px;color:#eee;background:rgba(0,0,0,.5);padding:2px 5px;pointer-events:none}
#mapa-modal .mapa-pin{position:absolute;left:50%;top:50%;width:40px;height:52px;margin-left:-20px;margin-top:-50px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#mapa-modal.sin-pin .mapa-pin{display:none}
#mapa-modal .mapa-info{font-size:14px;line-height:1.45;color:#eee}
#mapa-modal .mapa-info b{color:#fff}
#mapa-modal .mapa-info .sub{color:#aaa;font-size:12.5px}
#mapa-msg{font-size:13.5px}

<script>
/* Decodificador QR en JavaScript puro (sin dependencias). Implementación propia siguiendo ISO/IEC 18004:
   binarización por bloques, búsqueda de patrones de posición, homografía, lectura de formato/versión,
   des-entrelazado, corrección Reed-Solomon y parseo de segmentos (numérico, alfanumérico, bytes, ECI). */
(function(root){
'use strict';

/* ---------- GF(256) y Reed-Solomon ---------- */
const EXP=new Uint8Array(512), LOG=new Uint8Array(256);
(function(){ let x=1; for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11d; } for(let i=255;i<512;i++) EXP[i]=EXP[i-255]; })();
const gmul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
const ginv=a=>EXP[255-LOG[a]];

function rsDecode(msg, nsym){
  const n=msg.length; const synd=new Uint8Array(nsym); let err=false;
  for(let i=0;i<nsym;i++){ let s=0; const x=EXP[i]; for(let j=0;j<n;j++) s=gmul(s,x)^msg[j]; synd[i]=s; if(s) err=true; }
  if(!err) return msg;
  // Berlekamp–Massey
  let C=new Uint8Array(nsym+1), B=new Uint8Array(nsym+1); C[0]=1; B[0]=1; let L=0, m=1, b=1;
  for(let k=0;k<nsym;k++){
    let d=synd[k]; for(let i=1;i<=L;i++) d^=gmul(C[i],synd[k-i]);
    if(d===0){ m++; continue; }
    const T=C.slice(); const coef=gmul(d,ginv(b));
    for(let i=0;i+m<=nsym;i++) C[i+m]^=gmul(coef,B[i]);
    if(2*L<=k){ L=k+1-L; B=T; b=d; m=1; } else { m++; }
  }
  if(L>nsym/2) return null;
  // Chien: raíces de C en alpha^{-p}
  const errPos=[];
  for(let i=0;i<n;i++){ const p=n-1-i; const xinv=EXP[(255-(p%255))%255]; let v=0, xp=1; for(let k=0;k<=L;k++){ v^=gmul(C[k],xp); xp=gmul(xp,xinv); } if(v===0) errPos.push(i); }
  if(errPos.length!==L) return null;
  // Forney
  const Om=new Uint8Array(nsym); for(let i=0;i<nsym;i++){ let s=0; for(let k=0;k<=L && k<=i;k++) s^=gmul(synd[i-k],C[k]); Om[i]=s; }
  const out=Uint8Array.from(msg);
  for(const i of errPos){ const p=n-1-i; const X=EXP[p%255]; const Xinv=ginv(X);
    let om=0, xp=1; for(let k=0;k<nsym;k++){ om^=gmul(Om[k],xp); xp=gmul(xp,Xinv); }
    let dl=0; xp=1; const X2=gmul(Xinv,Xinv); for(let k=1;k<=L;k+=2){ dl^=gmul(C[k],xp); xp=gmul(xp,X2); }
    if(dl===0) return null; out[i]^=gmul(X,gmul(om,ginv(dl))); }
  for(let i=0;i<nsym;i++){ let s=0; const x=EXP[i]; for(let j=0;j<n;j++) s=gmul(s,x)^out[j]; if(s) return null; }
  return out;

/* ===================== Estándar de los apps de la empresa =====================
   Igual que el Registro de manejo 4.x, la Orden de compra 1.5 y el app de Itaverá:
   · lo primero es el código personal de 6 números (teclado de celular), sin lista de personas; sin señal entra con un código ya usado en el teléfono (guardado cifrado);
   · todo lo que se escribe se guarda solo en el teléfono cada 2 segundos y se copia a la nube; en otro teléfono, con el mismo código, vuelve solo;
   · el teléfono se sincroniza con la nube cada minuto con el app abierto;
   · el app se actualiza solo (busca la versión nueva en GitHub y se recarga en un momento seguro);
   · sin zoom de pellizco ni de doble toque (solo el mapa se acerca y se aleja). */

async function claveDe(codigo, uso) { const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(codigo)), 'PBKDF2', false, ['deriveBits', 'deriveKey']); const sal = new TextEncoder().encode('maquinas-ypoti|' + uso + '|' + dispositivoId());

// El teléfono recuerda a quien ya entró (para entrar sin señal): nombre y papeles a la vista; la sesión y la clave de firma, cifradas con su código.
async function recordarUsuario(codigo, s) {
  try { const id = await claveDe(codigo, 'id'); const k = await claveDe(codigo, 'aes'); const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify({ token: s.token, firma: s.firma || '', firma_v: s.firma_v || '' })));
    const idx = (await kvGet('usuarios_tel')) || {}; for (const h of Object.keys(idx)) { if (idx[h] === s.usuario.id && h !== id) { delete idx[h]; await kvDel('usr:' + h); } } idx[id] = s.usuario.id; await kvSet('usuarios_tel', idx);

// 1) Quien recibe (operador o chofer del prestador) muestra su "pedido de carga": un QR firmado con la clave de su teléfono.
// 2) El encargado lo lee, carga y registra los litros; su app muestra el "comprobante": otro QR firmado con la clave del encargado.
// 3) Quien recibe lee el comprobante y confirma los litros (o dice que no está conforme).

const fmtLit = l => { const n = Number(l); return isFinite(n) ? String(Math.round(n * 100) / 100) : ''; };

/* ===================== Arranque ===================== */

  cargarCfg();
  try { await db(); await cargarEventos(); } catch (e) { sinIDB = true; }
  await cargarSesion();
  listaUs = (await kvGet('lista_usuarios')) || null;
  if (sinIDB) toast('Este navegador no deja guardar datos: use Chrome normal (no incógnito).', 6000);
  if (!cfg.endpoint) { pila = [{ n: 'setup', p: {} }]; render(); }
  else inicio();
  pintarEstado();
  if (navigator.onLine && ses) { sincronizar({ catalogo: catalogoViejo() }).then(() => nubeSync()); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pintarEstado(); if (navigator.onLine && ses) { programarSync(500); programarNube(1500); } } });
  try { history.replaceState({ d: 1 }, ''); } catch (e) {}
  // service worker: la página se pide siempre primero a la red (así llega sola cada versión nueva que se sube a GitHub)
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; }).catch(() => {});
    let teniaControl = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!teniaControl) { teniaControl = true; return; } actPendiente = actPendiente || 'nueva'; aplicarActualizacion(); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  setTimeout(() => buscarActualizacion(true), 4000);
  { let v = null; try { v = sessionStorage.getItem('maq.actualizado'); sessionStorage.removeItem('maq.actualizado'); } catch (e) {} if (v) setTimeout(() => toast('App actualizado' + (v !== 'nueva' ? ' a la versión ' + APP_VERSION : '')), 800); }
}
